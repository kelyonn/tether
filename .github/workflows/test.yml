name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: lint · types · coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - uses: astral-sh/setup-uv@v5
      - name: Lockfile is current
        run: uv lock --check
      - name: Lint
        run: ruff check src tests scripts
      - name: Types
        run: mypy
      - name: Tests with coverage floor
        run: python -m pytest -q --cov

  e2e:
    name: live view in a browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install -e ".[dev,e2e]"
          python -m playwright install --with-deps chromium
      - name: Browser tests
        run: python -m pytest tests/e2e -q

  pytest:
    name: py${{ matrix.python }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest -q
      - name: Self-check (real server over stdio)
        run: |
          export TETHER_HOME="$RUNNER_TEMP/tether-home"
          python -m tether doctor --deep | sed -n '/deep check/,$p' | tee doctor.txt
          ! grep -q FAIL doctor.txt
