name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write      # sign build provenance
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5

      - name: Verify tag matches package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          py=$(python - <<'PY'
          import re, pathlib
          print(re.search(r'^version = "([^"]+)"', pathlib.Path("pyproject.toml").read_text(), re.M).group(1))
          PY
          )
          init=$(python - <<'PY'
          import re, pathlib
          print(re.search(r'^__version__ = "([^"]+)"', pathlib.Path("src/tether/__init__.py").read_text(), re.M).group(1))
          PY
          )
          echo "tag=$tag pyproject=$py __init__=$init"
          [ "$tag" = "$py" ] && [ "$tag" = "$init" ] || { echo "::error::version mismatch"; exit 1; }

      - name: Lint, types and tests
        run: |
          python -m pip install -e ".[dev]"
          ruff check src tests scripts
          mypy
          python -m pytest -q

      - name: Build wheel and sdist
        run: uv build

      - name: Build Desktop extension
        run: python scripts/build_extension.py

      - name: Extract release notes from CHANGELOG
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '
            $0 ~ "^## \\[" v "\\]" {on=1; next}
            on && /^## \[/ {exit}
            on {print}
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::no CHANGELOG section for $v"; exit 1
          fi
          cat release-notes.md

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
            dist/tether.mcpb

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/tether.mcpb
            release-notes.md

  publish-pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
      - run: mkdir upload && cp dist/*.whl dist/*.tar.gz upload/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: upload/

  github-release:
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
      - uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/tether.mcpb
