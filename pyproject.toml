[project]
name = "tether-mcp"
version = "0.4.0"
description = "Local-first project state (decisions, tasks, handoffs) shared across Claude Code, Desktop, Cowork, Chat and Design."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Kalyan" }]
keywords = ["mcp", "claude", "context", "memory", "tasks", "handoff"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
]
dependencies = [
    # MCP SDK 2.x (FastMCP was renamed MCPServer). Upper bound guards the next major.
    "mcp>=2.3,<3",
]

[project.urls]
Homepage = "https://github.com/kelyonn/tether"
Issues = "https://github.com/kelyonn/tether/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=7.1.0", "ruff>=0.6", "mypy>=1.10"]
# browser tests for the live view: pip install -e ".[e2e]" && playwright install chromium
e2e = ["playwright>=1.45"]
# `tether eval` (rule-following eval against the Claude API)
eval = ["anthropic>=2.6,<3"]

[project.scripts]
tether = "tether.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tether"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Browser tests run in their own process (a live Playwright loop breaks async tests):
#   pytest tests/e2e
addopts = "--ignore=tests/e2e"

[tool.coverage.run]
source = ["src/tether"]
branch = true

[tool.coverage.report]
fail_under = 76
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RUF"]
ignore = [
    "E501",    # long lines are fine in prose-heavy strings and SQL
    "SIM108",  # ternaries are not always clearer
    "SIM105",  # try/except/pass with a comment says why; suppress() hides it
    "SIM118",  # sqlite3.Row: `in` checks values, so .keys() is required
    "RUF001", "RUF002", "RUF003",  # the docs use real typographic characters
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B", "SIM", "RUF059", "E731"]
"src/tether/store/*.py" = ["F403", "F405"]  # mixins share the schema namespace

[tool.mypy]
python_version = "3.10"
files = ["src/tether"]
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
ignore_missing_imports = true
