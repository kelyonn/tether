[project]
name = "tether-mcp"
version = "0.4.0"
description = "Local-first project state (decisions, tasks, handoffs) shared across Claude Code, Desktop, Cowork, Chat and Design."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Kalyan" }]
keywords = ["mcp", "claude", "context", "memory", "tasks", "handoff"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
]
dependencies = [
    # MCP SDK 2.x (FastMCP was renamed MCPServer). Upper bound guards the next major.
    "mcp>=2.3,<3",
]

[project.urls]
Homepage = "https://github.com/kelyonn/tether"
Issues = "https://github.com/kelyonn/tether/issues"

[project.optional-dependencies]
dev = ["pytest>=8"]
# `tether eval` (rule-following eval against the Claude API)
eval = ["anthropic>=2.6,<3"]

[project.scripts]
tether = "tether.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tether"]

[tool.pytest.ini_options]
testpaths = ["tests"]
